<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>FitWork 語音回饋</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #14211f;
      --muted: #5b6b68;
      --line: #dfe7e5;
      --brand: #0f766e;
      --brand-ink: #ffffff;
      --brand-soft: #e3f2ef;
      --warn: #b45309;
      --warn-soft: #fef3e2;
      --danger: #b91c1c;
      --chip: #f1f5f4;
      --shadow: 0 1px 2px rgba(20, 33, 31, .06), 0 8px 24px rgba(20, 33, 31, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1413;
        --card: #16201f;
        --text: #e6efed;
        --muted: #9db0ac;
        --line: #26332f;
        --brand: #2dd4bf;
        --brand-ink: #062a26;
        --brand-soft: #123b36;
        --warn: #fbbf24;
        --warn-soft: #3a2a0c;
        --danger: #f87171;
        --chip: #1d2a28;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%;
    }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    section[hidden] { display: none; }
    h1 { font-size: 22px; line-height: 1.35; margin: 8px 0 8px; }
    h2 { font-size: 21px; line-height: 1.4; margin: 0 0 6px; }
    .say { color: var(--muted); font-size: 16px; margin: 0; }
    .say:empty { display: none; }
    .say::before { content: "🔊 "; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 15px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=text] {
      width: 100%; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    }
    input[type=text]:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600;
      background: var(--brand); color: var(--brand-ink); min-height: 48px;
    }
    .btn.block { width: 100%; }
    .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; min-width: 0; }
    .error { color: var(--danger); font-size: 15px; margin-top: 8px; min-height: 1em; }

    /* progress */
    .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 14px; }
    .progress > div { height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }

    /* options */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; }
    .chip {
      border: 1px solid var(--line); background: var(--chip); color: var(--text);
      border-radius: 999px; padding: 9px 14px; font-size: 16px; min-height: 42px;
    }
    .chip[aria-pressed=true] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .group-item { padding: 10px 0; border-top: 1px solid var(--line); }
    .group-item:first-of-type { border-top: 0; }
    .group-item .name { font-weight: 600; font-size: 16px; }
    .group-item .chips { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 6px; gap: 5px; }
    .group-item .chip { padding: 5px 2px; font-size: 13px; line-height: 1.25; min-height: 44px; border-radius: 10px; word-break: keep-all; }
    .hint { background: var(--brand-soft); border-radius: 10px; padding: 8px 12px; font-size: 15px; margin-top: 10px; }

    /* mic */
    #screen-ask:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100dvh - 16px); }
    .dock {
      position: sticky; bottom: 0; z-index: 2;
      margin: auto -16px calc(-24px - env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--card); border-top: 1px solid var(--line);
    }
    .mic {
      flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: var(--brand); color: var(--brand-ink); display: grid; place-items: center;
      transition: transform .15s ease, box-shadow .08s linear; --level: 0;
    }
    .mic svg { width: 30px; height: 30px; }
    .mic.listening { box-shadow: 0 0 0 calc(5px + var(--level) * 16px) rgba(45, 212, 191, .3); }
    .mic.thinking { background: var(--muted); animation: breathe 1.2s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .55; } }
    .mic:active { transform: scale(.96); }
    .status { flex: 1; font-size: 16px; color: var(--muted); }
    .status:empty::before { content: "按麥克風開始說話"; }
    .status.warn { color: var(--warn); }
    .heard { font-size: 15px; color: var(--muted); margin: 0 4px; }
    .heard:empty { display: none; }

    /* recorded */
    .recorded { list-style: none; padding: 0; margin: 4px 0 0; }
    .recorded:empty { display: none; }
    .recorded li {
      display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
      padding: 8px 12px; border-radius: 10px; background: var(--brand-soft); margin-top: 6px; font-size: 15px;
    }
    .tag { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

    .alt { margin: 10px 4px 0; }
    .alt summary { color: var(--muted); font-size: 15px; cursor: pointer; padding: 6px 0; }
    .actions { display: flex; gap: 8px; margin: 10px 0 16px; }
    .actions .btn { flex: 1; }

    /* review */
    .review { list-style: none; padding: 0; margin: 0; }
    .review li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .review li:first-child { border-top: 0; }
    .review .q { font-size: 14px; color: var(--muted); }
    .review .v { font-weight: 600; word-break: break-word; }
    .review button { grid-row: 1 / span 2; grid-column: 2; align-self: center; background: none; border: 1px solid var(--line); color: var(--brand); border-radius: 10px; padding: 6px 12px; }
    .done { text-align: center; padding: 28px 18px; }
    .done .big { font-size: 48px; }
  </style>
</head>
<body>
<main>
  <!-- 1. start -->
  <section id="screen-start">
    <h1 id="title">FitWork APP 使用滿意度與回饋調查</h1>
    <p class="muted" id="intro"></p>
    <div class="card">
      <label for="emp">工號</label>
      <input id="emp" type="text" autocomplete="off" autocapitalize="characters" placeholder="請輸入工號">
      <p class="muted" style="margin:10px 0 14px">接下來會用語音一題一題問你，請允許使用麥克風。錄音只用來辨識你的回答，不會保存。</p>
      <button id="btn-start" class="btn block" disabled>載入中…</button>
      <div class="error" id="start-error"></div>
    </div>
    <p class="muted" style="text-align:center">想像聊天一樣回答？<a href="live.html" style="color:var(--brand)">改用自然對話版</a></p>
  </section>

  <!-- 2. question -->
  <section id="screen-ask" hidden>
    <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    <div class="card">
      <h2 id="q-title"></h2>
      <p id="say" class="say"></p>
      <div id="q-body"></div>
      <div id="q-hint" class="hint" hidden></div>
    </div>

    <p id="heard" class="heard"></p>
    <ul id="recorded" class="recorded"></ul>

    <details class="alt" id="alt">
      <summary>不方便說話？改用打字</summary>
      <div class="row" style="margin-top:6px">
        <input id="typed" type="text" autocomplete="off" placeholder="輸入你的回答">
        <button id="btn-typed" class="btn">送出</button>
      </div>
    </details>
    <div class="actions">
      <button id="btn-skip" class="btn ghost" hidden>跳過這題</button>
      <button id="btn-next" class="btn" hidden>確定</button>
    </div>

    <!-- microphone bar, always visible at the bottom -->
    <div class="dock" id="dock">
      <button id="mic" class="mic" aria-label="開始或停止說話">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- 3. review -->
  <section id="screen-review" hidden>
    <h1>確認你的回答</h1>
    <p class="muted">有需要修改的，點「修改」重新回答。</p>
    <div class="card"><ul id="review" class="review"></ul></div>
    <button id="btn-submit" class="btn block">送出問卷</button>
    <div class="error" id="submit-error"></div>
  </section>

  <!-- 4. done -->
  <section id="screen-done" hidden>
    <div class="card done">
      <div class="big">🙏</div>
      <h1>謝謝你的回饋！</h1>
      <p class="muted">回覆編號：<span id="done-id"></span></p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
